# Domain registry. Format:
#   <domain> = <workspace_subdir>[, <alias>...] : <comma-separated files>
#
# The FIRST workspace path is canonical — the managed files live there. Aliases
# are extra folder names the domain answers to when detecting a project's
# domain from its path; they hold no config. `A > B` maps a file named A on the
# PROJECT side to B inside this repo.
#
# Adding a domain is a one-line change here plus the workspace folder. No
# script edits — everything reads this registry through the harness.

myproject = workspace/myproject : CLAUDE.md

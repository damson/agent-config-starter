name: Coverage

# kcov measures how much of the vendored engine (.harness lib and the
# validators) this template's own checks exercise, and hands the result to
# Codecov for the PR comment and README badge. Informational only; ci.yml
# stays the gate. Note the measured files live inside the submodule, so
# Codecov's per-file view is limited; the project number is the signal.
permissions:
  contents: read
  id-token: write

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats

      - name: Restore kcov from cache
        uses: actions/cache@v4
        with:
          path: ~/.local/kcov
          key: kcov-43-${{ runner.os }}-noble

      - name: Build kcov if the cache missed
        timeout-minutes: 10
        run: .github/install-kcov.sh

      - name: Run the template checks under kcov
        run: |
          set -euo pipefail
          "$HOME/.local/kcov/bin/kcov" \
               --include-path="$PWD/.harness/bin,$PWD/.harness/lib" \
               --bash-parse-files-in-dir="$PWD/.harness/bin" \
               --bash-parse-files-in-dir="$PWD/.harness/lib" \
               --exclude-pattern=/tests/ \
               coverage-out "$(command -v bats)" tests/
          xml="coverage-out/kcov-merged/cobertura.xml"
          if [ ! -f "$xml" ]; then
            xml=$(find coverage-out -maxdepth 2 -name cobertura.xml | sort | head -1)
          fi
          if [ -z "$xml" ] || [ ! -f "$xml" ]; then
            echo "::error::kcov produced no cobertura.xml — tree follows"
            find coverage-out -maxdepth 3 | head -40
            exit 1
          fi
          echo "COBERTURA=$xml" >> "$GITHUB_ENV"

      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ${{ env.COBERTURA }}
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

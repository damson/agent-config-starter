# Codecov owns the coverage PR comment and the README badge. Informational
# only: ci.yml is the gate, coverage is the trend. The measured sources live
# in the .harness submodule, so the per-file view is limited by design.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, files"
  behavior: default
  require_changes: false
